<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="login">

        <!-- Image section for login page -->
        <div class="login_img">
            <img id="slide_img" src="../images/image1.jpg" alt="Slider">
            <div class="login_img_top">
                <div class="logo">Shifty</div>
                <a href="../html/home.html" class="back-btn">Back to previous page. &rarr;</a>
            </div>
            <div class="login_img_bottom">
                <h2>Life is simpler,<br>than it seems</h2>
            </div>
        </div>

        <div class="login_form">

            <form id="signup">
                <h2>Create an account</h2>
                <p>Already have an account?
                    <a href="#" onclick="showLogin(); return false;">Log in</a>
                </p>

                <div class="name_row">
                    <input type="text" id="firstname" placeholder="First Name" required>
                    <input type="text" id="lastname" placeholder="Last Name" required>
                </div>
                <input type="text" id="signup_companyID" placeholder="Company ID" required>
                <input type="email" id="signup_email" placeholder="Email Address" required>

                <div class="password_field">
                    <input type="password" placeholder="Password" id="signup_password" required>
                    <button type="button" class="eye_btn" onclick="togglePassword('login_password', this)">👁</button>
                </div>
                <div class="password_rules">
                    <p id="upper">✗ First letter must be uppercase</p>
                    <p id="length">✗ At least 8 characters</p>
                    <p id="number">✗ Contains a number</p>
                    <p id="symbol">✗ Contains a symbol</p>
                </div>

                <label class="terms">
                    <input type="checkbox" id="terms" required>
                    I agree to the
                    <a href="../html/terms.html" target="_blank">Terms and Conditions</a>
                </label>
                <div id="termsError" class="error-message"></div>

                <button type="button" onclick="submitSignup()">Create account</button>
            </form>

            <!-- Create another form for the login page. -->
            <form id="login">
                <h2>Log in</h2>
                <p>Don't have an account?
                    <a href="#" onclick="showSignup(); return false;">Create Account</a>
                </p>
                <input type="text" id="login_companyID" placeholder="Company ID" required>
                <input type="email" id="login_email" placeholder="Email Address" required>

                <div class="password_field">
                    <input type="password" placeholder="Password" id="login_password">
                    <button type="button" class="eye_btn" onclick="togglePassword('login_password', this)">👁</button>
                </div>

                <div class="row_between">
                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>
                <button type="button" onclick="loginUser()">Login</button>
            </form>
            
        </div>
    </div>

    <script src="../js/login.js" defer></script>
</body>
</html>
