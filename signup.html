<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a company</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="signup">

        <!-- Image section for signup page -->
        <div class="signup_img">
            <img id="slide_img" src="images/image1.jpg" alt="Slider">
            <div class="signup_img_top">
                <div class="logo">Shifty</div>
                <a href="index.html" class="back-btn">Back to previous page. &rarr;</a>
            </div>
            <div class="dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <div class="signup_img_bottom">
                <h2>Life is simpler,<br>than it seems</h2>
            </div>
        </div>

        <div class="signup_form">

            <form id="signup">
                <h2>Create a company account</h2>
                <p>Already have an account?
                    <a href="signup.html" onclick="showsignup(); return false;">Log in</a>
                </p>

                <div class="name_row">
                    <input type="text" placeholder="First Name">
                    <input type="text" placeholder="Last Name">
                </div>
                <input type="text" placeholder="Company Name">
                <input type="email" placeholder="Email Address">

                <div class="password_field">
                    <input type="password" placeholder="Password" id="signup_password">
                    <button type="button" class="eye_btn" onclick="togglePassword('signup_password', this)">👁</button>
                </div>

                <label class="terms">
                    <input type="checkbox" id="terms" required>
                    I agree to the
                    <a href="terms.html" target="_blank">Terms and Conditions</a>
                </label>

                <button type="button" onclick="submitSignup()">Create a account</button>
            </form>
       

        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
